name: Python Code Quality and Lint

on:
  push:
    branches: [ master ]
    paths:
      - 'wikibaseintegrator/**.py'
      - 'test/**.py'
      - 'pyproject.toml'
      - 'poetry.lock'
  pull_request:
    branches: [ '**' ]
    paths:
      - 'wikibaseintegrator/**.py'
      - 'test/**.py'
      - 'pyproject.toml'
      - 'poetry.lock'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: 'poetry'

      # Need to install poetry again in the new python version
      - name: Install poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: |
          python -m poetry install --with dev

      - name: isort imports check
        run: |
          python -m poetry run isort --check --diff wikibaseintegrator test

      - name: mypy typing check
        run: |
          python -m poetry run mypy --install-types --non-interactive

      - name: pylint code linting
        # Errors and warnings fail the build, conventions and refactoring suggestions are only reported. In the tests, the
        # pytest fixtures make redefined-outer-name and unused-argument false positives, and testing private helpers is fine.
        run: |
          python -m poetry run pylint --fail-under=0 --fail-on=E,W,F wikibaseintegrator
          python -m poetry run pylint --fail-under=0 --fail-on=E,W,F --disable=redefined-outer-name,unused-argument,protected-access test

      - name: codespell spell checking
        run: |
          python -m poetry run codespell wikibaseintegrator test

      - name: flynt string formatter converting
        run: |
          python -m poetry run flynt -f wikibaseintegrator test

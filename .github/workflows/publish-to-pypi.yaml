name: Publish Python 🐍 distributions 📦 to PyPI, TestPyPI and GitHub Release

# Publishing a release on GitHub publishes the package: see "Releasing" in AGENTS.md.
# The pushes and pull requests only build the package, as a check.
on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]
  release:
    types: [ published ]

jobs:
  build:
    name: Build Python 🐍 distributions 📦
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python 3.14
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: 'poetry'

      # Need to install poetry again in the new python version
      - name: Install poetry
        run: python -m pip install poetry

      # Never publish a version that doesn't match the release, e.g. when the release is created before the version bump
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python -m poetry version --short)"
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::The release tag ${TAG} doesn't match the version ${VERSION} of pyproject.toml"
            exit 1
          fi

      - name: Build a binary wheel and a source tarball
        run: >-
          python -m
          poetry
          build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    if: github.event_name == 'release'  # only publish when a release is published
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/wikibaseintegrator

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    if: github.event_name == 'release'  # only publish when a release is published
    needs:
      - build
      - publish-to-testpypi
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/wikibaseintegrator

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to the GitHub Release
    if: github.event_name == 'release'  # only publish when a release is published
    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for uploading to GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      # On a release event, the action itself attaches the built packages, the source archives of the release and
      # their Sigstore signatures to the release: uploading them again fails with "asset under the same name already exists".
      - name: Sign the dists with Sigstore and upload them to the GitHub Release
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
          release-signing-artifacts: true

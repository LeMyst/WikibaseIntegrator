name: Documentation

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'wikibaseintegrator/**.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/docs.yaml'
  pull_request:
    branches: [ '**' ]
    paths:
      - 'docs/**'
      - 'wikibaseintegrator/**.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/docs.yaml'

permissions:
  contents: read

jobs:
  sphinx:
    name: Sphinx build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: 'poetry'

      # Need to install poetry again in the new python version
      - name: Install poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: |
          python -m poetry install --with docs

      # Read the Docs builds the published documentation: this catches a broken build (e.g. an autodoc import error or a
      # malformed docstring) in the pull request. Every warning fails, except the [myst.header] ones: the changelog page
      # renders the GitHub release notes, whose Markdown headings start at H2.
      - name: Build the documentation
        run: |
          python -m poetry run python -m sphinx -b html --keep-going -w sphinx-warnings.log docs/source docs/_build/html
          if grep -v '\[myst.header\]' sphinx-warnings.log | grep .; then
            echo "::error::The documentation build has warnings"
            exit 1
          fi

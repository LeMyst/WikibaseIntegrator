# Wikibase instance for the WikibaseIntegrator integration tests: Wikibase with the
# WikibaseLexeme extension (built from ./Dockerfile) and a query service (WDQS)
# kept up to date by its updater, for the fast run mode.
#
#   docker compose -f test/integration/docker-compose.yml up -d --build
#   # wait for http://localhost:8880 to answer (first boot runs the MediaWiki
#   # installer and can take a minute), then:
#   WBI_INTEGRATION_MEDIAWIKI_API_URL=http://localhost:8880/w/api.php \
#   WBI_INTEGRATION_SPARQL_ENDPOINT_URL=http://localhost:9999/bigdata/namespace/wdq/sparql \
#   WBI_INTEGRATION_WIKIBASE_URL=http://localhost:8880 \
#   WBI_INTEGRATION_USER=WikibaseAdmin \
#   WBI_INTEGRATION_PASSWORD=WikibaseDockerAdminPass \
#   pytest -m integration
#
#   # to reset to a clean instance (wipes the generated config and the database):
#   docker compose -f test/integration/docker-compose.yml down -v
#
# Based on the Wikibase Suite (release pipeline) images:
# https://github.com/wmde/wikibase-release-pipeline
#
# Note: the wikibase/wikibase image requires a volume mounted at /config. On
# first boot, with an empty volume, its entrypoint generates LocalSettings.php
# and the wiki secret key there from the environment variables below. Because
# that generated config is persisted, the database is persisted with the same
# lifecycle so both stay in sync (use `down -v` to reset both together).
# Elasticsearch/CirrusSearch stay disabled as long as ELASTICSEARCH_HOST is unset.
services:
  wikibase:
    build: .
    image: wikibaseintegrator-integration-wikibase
    ports:
      - "8880:80"
    environment:
      MW_ADMIN_NAME: WikibaseAdmin
      MW_ADMIN_PASS: WikibaseDockerAdminPass
      MW_ADMIN_EMAIL: admin@wikibase.example
      MW_WG_SERVER: http://localhost:8880
      # The image forces an explicit opt-in/opt-out for the WMDE metadata pingback;
      # leaving it unset makes the container exit. Disabled for a local test instance.
      # (quoted so compose passes the literal string "false", not a YAML boolean)
      METADATA_CALLBACK: "false"
      DB_SERVER: mysql:3306
      DB_NAME: wikibase
      DB_USER: wikibase
      DB_PASS: wikibase
    volumes:
      - wikibase-config:/config
      - wikibase-image-data:/var/www/html/images
    depends_on:
      mysql:
        condition: service_healthy

  # The query service, read by the fast run mode
  wdqs:
    image: wikibase/wdqs:2
    command: /runBlazegraph.sh
    ports:
      - "9999:9999"
    # Blazegraph aborts with a lower limit of open files
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
    volumes:
      - wdqs-data:/wdqs/data
    healthcheck:
      test: curl --silent --fail localhost:9999/bigdata/namespace/wdq/sparql
      start_period: 2m
      interval: 5s
      retries: 30

  # Loads the recent changes of the wiki into the query service (every few seconds)
  wdqs-updater:
    image: wikibase/wdqs:2
    command: /runUpdate.sh
    # It exits when the wiki isn't installed yet: it's started again until it is
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
    environment:
      # The concept URI of the wiki, from MW_WG_SERVER: http://localhost:8880/entity/Q1
      WIKIBASE_CONCEPT_URI: http://localhost:8880
    depends_on:
      wdqs:
        condition: service_healthy

  mysql:
    image: mariadb:10.11
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: wikibase
      MYSQL_USER: wikibase
      MYSQL_PASSWORD: wikibase
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: healthcheck.sh --connect --innodb_initialized
      start_period: 30s
      interval: 5s
      retries: 20

volumes:
  wikibase-config:
  wikibase-image-data:
  mysql-data:
  wdqs-data:
